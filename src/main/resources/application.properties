# Campus Lost & Found - Spring Boot configuration
server.port=8080
spring.application.name=campus-lost-found

# Accept request bodies that omit primitive ids (lostId/foundId default to 0)
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Database credentials are read from src/main/resources/db.properties
# (shared with the console version of the application via DatabaseManager).
